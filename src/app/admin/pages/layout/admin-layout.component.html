<div class="d-flex" style="min-height: 100vh;">
  <nav class="admin-sidebar text-white">
    <div class="px-3 py-4 border-bottom border-secondary">
      <a routerLink="/admin" class="text-white text-decoration-none fw-bold fs-5">
        <i class="fas fa-gauge-high me-2"></i>Admin Panel
      </a>
    </div>

    <ul class="nav flex-column p-2">
      <li class="nav-item">
        <a class="nav-link text-white-50" routerLink="/admin" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active-link">
          <i class="fas fa-house me-2"></i>Overview
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white-50" routerLink="/admin/products" routerLinkActive="active-link">
          <i class="fas fa-box-open me-2"></i>Products
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white-50" routerLink="/admin/brands" routerLinkActive="active-link">
          <i class="fas fa-copyright me-2"></i>Brands
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white-50" routerLink="/admin/types" routerLinkActive="active-link">
          <i class="fas fa-tags me-2"></i>Types
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white-50" routerLink="/admin/orders" routerLinkActive="active-link">
          <i class="fas fa-receipt me-2"></i>Orders
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white-50" routerLink="/admin/users" routerLinkActive="active-link">
          <i class="fas fa-users me-2"></i>Users
        </a>
      </li>
      <li class="nav-item mt-3 border-top border-secondary pt-3">
        <a class="nav-link text-white-50" routerLink="/">
          <i class="fas fa-arrow-left me-2"></i>Back to Store
        </a>
      </li>
    </ul>
  </nav>

  <main class="flex-grow-1 admin-content p-4">
    <router-outlet></router-outlet>
  </main>
</div>
