<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Products</h1>
  <a routerLink="/admin/products/new" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Add Product</a>
</div>

<div class="admin-card">
  @if (products().length > 0) {
    <table class="table align-middle">
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Brand</th>
          <th>Type</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (product of products(); track product.id) {
          <tr>
            <td><img [src]="product.pictureUrl" style="width:46px;height:46px;object-fit:contain;" [alt]="product.name" /></td>
            <td>{{ product.name }}</td>
            <td>{{ product.productBrand }}</td>
            <td>{{ product.productType }}</td>
            <td>{{ product.price | currency }}</td>
            <td>
              <a class="btn btn-sm btn-outline-warning" [routerLink]="['/admin/products', product.id, 'edit']"><i class="fas fa-pen"></i></a>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(product)"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p class="text-muted text-center py-4 mb-0">No products yet.</p>
  }
</div>
