<section class="hero-section text-white text-center py-5">
  <div class="container py-5">
    <h1 class="display-4 fw-bold">Everything you need, in one place</h1>
    <p class="lead mb-4">Great products, great prices, delivered to your door.</p>
    <a routerLink="/products" class="btn btn-light btn-lg px-4">
      <i class="fas fa-bag-shopping me-2"></i>Shop Now
    </a>
  </div>
</section>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Featured Products</h2>
    <a routerLink="/products" class="btn btn-outline-primary">View All</a>
  </div>

  <div class="row g-4">
    @for (product of featuredProducts(); track product.id) {
      <div class="col-6 col-md-4 col-lg-3">
        <a class="text-decoration-none text-dark" [routerLink]="['/products', product.id]">
          <div class="card h-100 product-card shadow-sm">
            <img [src]="product.pictureUrl" class="card-img-top product-image" [alt]="product.name" onerror="this.src='/assets/no-image.png'" />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title">{{ product.name }}</h6>
              <div class="text-muted small mb-2">{{ product.productBrand }}</div>
              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fw-bold text-primary">{{ product.price | currency }}</span>
                <button class="btn btn-sm btn-primary" (click)="addToCart(product, $event)">
                  <i class="fas fa-cart-plus"></i>
                </button>
              </div>
            </div>
          </div>
        </a>
      </div>
    }
  </div>
</div>
