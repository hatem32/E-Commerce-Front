<div class="verify-page">

  <div class="verify-card">

    <!-- Icon -->
    <div class="verify-icon">
      <i class="fas fa-envelope-circle-check"></i>
    </div>

    <!-- Heading -->
    <div class="verify-heading">

      <div class="verify-eyebrow">
        ACCOUNT SECURITY
      </div>

      <h1>Verify your email</h1>

      <p>
        We sent a 6-digit verification code to
        <strong>{{ email }}</strong>
      </p>

    </div>

    <!-- Form -->
    <form
      class="verify-form"
      (ngSubmit)="submit()">

      <label for="otp">
        Verification Code
      </label>

      <input
        id="otp"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        class="verify-otp-input"
        placeholder="000000"
        [(ngModel)]="otp"
        name="otp"
        required
      />

      <div class="verify-hint">
        Enter the 6-digit code from your email.
      </div>

      @if (errorMessage()) {
        <div class="verify-error">
          <i class="fas fa-circle-exclamation"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button
        type="submit"
        class="verify-submit-btn"
        [disabled]="loading() || otp.length !== 6">

        @if (loading()) {
          <span class="spinner-border spinner-border-sm"></span>
          Verifying...
        } @else {
          Verify &amp; Continue
          <i class="fas fa-arrow-right"></i>
        }

      </button>

    </form>

    <!-- Resend -->
    <div class="verify-resend">

      <span>Didn't receive the code?</span>

      <button
        type="button"
        [disabled]="resending()"
        (click)="resend()">

        @if (resending()) {
          <span class="spinner-border spinner-border-sm"></span>
          Sending...
        } @else {
          Resend code
        }

      </button>

    </div>

    <!-- Security -->
    <div class="verify-security">
      <i class="fas fa-shield-halved"></i>

      <span>
        Your verification code is secure and will only be used to verify your account.
      </span>
    </div>

  </div>

</div>
