<div class="container py-5">
  <h2 class="mb-4">My Wishlist</h2>

  @if (wishlist.items().length > 0) {
    <div class="row g-4">
      @for (item of wishlist.items(); track item.id) {
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card h-100 product-card shadow-sm">
            <a [routerLink]="['/products', item.productId]" class="text-decoration-none text-dark">
              <img [src]="item.pictureUrl" class="card-img-top product-image" [alt]="item.productName" />
            </a>
            <div class="card-body d-flex flex-column">
              <h6 class="card-title">{{ item.productName }}</h6>
              <div class="text-muted small mb-2">{{ item.productBrand }}</div>
              <div class="fw-bold text-primary mb-2">{{ item.price | currency }}</div>
              <div class="mt-auto d-flex gap-2">
                <button class="btn btn-sm btn-primary flex-grow-1" (click)="addToCart(item)">
                  <i class="fas fa-cart-plus me-1"></i>Add to Cart
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="remove(item)">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="text-center text-muted py-5">
      <i class="fas fa-heart fa-2x mb-2"></i>
      <p>Your wishlist is empty.</p>
      <a routerLink="/products" class="btn btn-primary">Browse Products</a>
    </div>
  }
</div>
