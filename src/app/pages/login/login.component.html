<div class="container py-5" style="max-width: 420px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h3 class="text-center mb-4"><i class="fas fa-bag-shopping me-2"></i>Login</h3>

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="credentials.email" name="email" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="credentials.password" name="password" required />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Login
        </button>
      </form>

      <div class="text-center mt-3 small">
        Don't have an account? <a routerLink="/register">Create one</a>
      </div>
    </div>
  </div>
</div>
