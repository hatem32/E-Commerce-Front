<div class="container py-5" style="max-width: 460px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h3 class="text-center mb-4"><i class="fas fa-user-plus me-2"></i>Create Account</h3>

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Display Name</label>
          <input class="form-control" [(ngModel)]="model.displayName" name="displayName" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" [(ngModel)]="model.userName" name="userName" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="model.email" name="email" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Phone (optional)</label>
          <input class="form-control" [(ngModel)]="model.phoneNumber" name="phoneNumber" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="model.password" name="password" minlength="8" required />
          <div class="form-text">At least 8 characters.</div>
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Create Account
        </button>
      </form>

      <div class="text-center mt-3 small">
        Already have an account? <a routerLink="/login">Login</a>
      </div>
    </div>
  </div>
</div>
