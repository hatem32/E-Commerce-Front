<div class="toast-stack">
  @for (toast of notifications.toasts(); track toast.id) {
    <div class="app-toast" [class.toast-success]="toast.type === 'success'"
         [class.toast-error]="toast.type === 'error'"
         [class.toast-info]="toast.type === 'info'">
      <i class="fas" [class]="'fas ' + iconFor(toast.type)"></i>
      <span class="flex-grow-1">{{ toast.message }}</span>
      <button type="button" class="toast-close" (click)="notifications.dismiss(toast.id)">
        <i class="fas fa-xmark"></i>
      </button>
    </div>
  }
</div>
